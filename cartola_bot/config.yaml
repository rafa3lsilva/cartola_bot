# Configurações do Cartola Bot
# ----------------------------

api:
  mercado_url: "https://api.cartola.globo.com/atletas/mercado"
  partidas_url: "https://api.cartola.globo.com/partidas"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

scoring:
  weights:
    # Fatores ofensivos / gerais
    home_attack_multiplier: 1.15   # Multiplicador para atletas mandantes
    away_attack_multiplier: 0.85   # Multiplicador para atletas visitantes
    
    # Modelo de probabilidade de Saldo de Gol (SG) para linha de defesa
    sg_base_prob: 0.30             # Probabilidade base de Clean Sheet no Brasileirão
    sg_home_bonus: 0.15            # Bônus para mandante na chance de SG
    sg_away_penalty: 0.10          # Penalidade para visitante na chance de SG
    
    # Impacto da classificação do adversário (Pos 1 a 20)
    opp_strength_weight: 0.015     # Ajuste percentual por posição relativa

formations:
  "4-3-3":
    Goleiro: 1
    Lateral: 2
    Zagueiro: 2
    Meia: 3
    Atacante: 3
    Técnico: 1
  "4-4-2":
    Goleiro: 1
    Lateral: 2
    Zagueiro: 2
    Meia: 4
    Atacante: 2
    Técnico: 1
  "3-5-2":
    Goleiro: 1
    Lateral: 0
    Zagueiro: 3
    Meia: 5
    Atacante: 2
    Técnico: 1
  "3-4-3":
    Goleiro: 1
    Lateral: 0
    Zagueiro: 3
    Meia: 4
    Atacante: 3
    Técnico: 1
  "5-3-2":
    Goleiro: 1
    Lateral: 2
    Zagueiro: 3
    Meia: 3
    Atacante: 1
    Técnico: 1

defaults:
  budget: 146.07
  formation: "auto"
  auto_formation: true
  max_players_per_club: 5
  min_games: 2
  min_games_threshold: 3 # Só filtra min_games se o máximo de jogos no DF for maior que isso

